name: create-user
description: >-
  Create a CubeFS S3-compatible user account with access key, secret key, and
  initial volume policy.
api: cubefs-master-api
operationId: createUser
method: POST
path: /user/create
inputs:
  - name: user
    in: body
    required: true
    description: User payload with id, type, accessKey, secretKey, and policy.
outputs:
  - name: user
    description: Created user record.
sideEffects: create
authentication: cluster-admin
