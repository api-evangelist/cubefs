name: get-cluster-stat
description: >-
  Return aggregate cluster statistics including total/used capacity, data
  node counts, meta node counts, and zone topology.
api: cubefs-master-api
operationId: getClusterStat
method: GET
path: /cluster/stat
inputs: []
outputs:
  - name: stat
    description: Aggregate cluster statistics.
sideEffects: read-only
authentication: cluster-admin
