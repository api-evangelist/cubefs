name: create-volume
description: >-
  Create a new CubeFS volume on a cluster, specifying owner, capacity,
  meta-partition count, replication, and cross-zone settings.
api: cubefs-master-api
operationId: createVolume
method: GET
path: /admin/createVol
inputs:
  - name: name
    in: query
    required: true
    description: Volume name.
  - name: capacity
    in: query
    required: true
    description: Volume capacity in GB.
  - name: owner
    in: query
    required: true
    description: Owner identifier.
  - name: mpCount
    in: query
    required: false
    description: Initial meta-partition count.
  - name: replicaNum
    in: query
    required: false
    description: Replication factor for data partitions.
  - name: crossZone
    in: query
    required: false
    description: Whether replicas span availability zones.
outputs:
  - name: volume
    description: Created volume metadata including ID and partition layout.
sideEffects: create
authentication: cluster-admin
