naftiko: 1.0.0-alpha2
info:
  label: CubeFS S3-Compatible API — Buckets
  description: 'CubeFS S3-Compatible API — Buckets. 4 operations. Lead operation: CubeFS List buckets. Self-contained Naftiko
    capability covering one Cubefs business surface.'
  tags:
  - Cubefs
  - Buckets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CUBEFS_API_KEY: CUBEFS_API_KEY
capability:
  consumes:
  - type: http
    namespace: s3-buckets
    baseUri: http://{objectNodeHost}:{objectNodePort}
    description: CubeFS S3-Compatible API — Buckets business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: listbuckets
        method: GET
        description: CubeFS List buckets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bucket
      path: /{bucket}
      operations:
      - name: createbucket
        method: PUT
        description: CubeFS Create a bucket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: headbucket
        method: HEAD
        description: CubeFS Check if a bucket exists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletebucket
        method: DELETE
        description: CubeFS Delete a bucket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CUBEFS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: s3-buckets-rest
    port: 8080
    description: REST adapter for CubeFS S3-Compatible API — Buckets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: listbuckets
        description: CubeFS List buckets
        call: s3-buckets.listbuckets
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{bucket}
      name: bucket
      description: REST surface for bucket.
      operations:
      - method: PUT
        name: createbucket
        description: CubeFS Create a bucket
        call: s3-buckets.createbucket
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: HEAD
        name: headbucket
        description: CubeFS Check if a bucket exists
        call: s3-buckets.headbucket
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletebucket
        description: CubeFS Delete a bucket
        call: s3-buckets.deletebucket
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: s3-buckets-mcp
    port: 9090
    transport: http
    description: MCP adapter for CubeFS S3-Compatible API — Buckets. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cubefs-list-buckets
      description: CubeFS List buckets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: s3-buckets.listbuckets
      outputParameters:
      - type: object
        mapping: $.
    - name: cubefs-create-bucket
      description: CubeFS Create a bucket
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: s3-buckets.createbucket
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cubefs-check-if-bucket-exists
      description: CubeFS Check if a bucket exists
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: s3-buckets.headbucket
      outputParameters:
      - type: object
        mapping: $.
    - name: cubefs-delete-bucket
      description: CubeFS Delete a bucket
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: s3-buckets.deletebucket
      outputParameters:
      - type: object
        mapping: $.
