name: decommission-data-node
description: >-
  Decommission a CubeFS data node, migrating its partitions to remaining nodes
  in preparation for removal from the cluster.
api: cubefs-master-api
operationId: decommissionDataNode
method: GET
path: /dataNode/decommission
inputs:
  - name: addr
    in: query
    required: true
    description: Network address of the data node to decommission.
outputs:
  - name: result
    description: Decommission task acknowledgement.
sideEffects: cluster-admin
authentication: cluster-admin
