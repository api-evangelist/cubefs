naftiko: 1.0.0-alpha2
info:
  label: CubeFS Master API — DataPartitions
  description: 'CubeFS Master API — DataPartitions. 2 operations. Lead operation: CubeFS Create a data partition. Self-contained
    Naftiko capability covering one Cubefs business surface.'
  tags:
  - Cubefs
  - DataPartitions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CUBEFS_API_KEY: CUBEFS_API_KEY
capability:
  consumes:
  - type: http
    namespace: master-datapartitions
    baseUri: http://{masterHost}:{masterPort}
    description: CubeFS Master API — DataPartitions business capability. Self-contained, no shared references.
    resources:
    - name: dataPartition-create
      path: /dataPartition/create
      operations:
      - name: createdatapartition
        method: GET
        description: CubeFS Create a data partition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of data partitions to create.
          required: true
        - name: name
          in: query
          type: string
          description: Name of the volume to create data partitions for.
          required: true
    - name: dataPartition-decommission
      path: /dataPartition/decommission
      operations:
      - name: decommissiondatapartition
        method: GET
        description: CubeFS Decommission a data partition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: integer
          description: ID of the data partition to decommission.
          required: true
        - name: addr
          in: query
          type: string
          description: Address of the data node hosting the partition to migrate away from.
          required: true
  exposes:
  - type: rest
    namespace: master-datapartitions-rest
    port: 8080
    description: REST adapter for CubeFS Master API — DataPartitions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/datapartition/create
      name: datapartition-create
      description: REST surface for dataPartition-create.
      operations:
      - method: GET
        name: createdatapartition
        description: CubeFS Create a data partition
        call: master-datapartitions.createdatapartition
        with:
          count: rest.count
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/datapartition/decommission
      name: datapartition-decommission
      description: REST surface for dataPartition-decommission.
      operations:
      - method: GET
        name: decommissiondatapartition
        description: CubeFS Decommission a data partition
        call: master-datapartitions.decommissiondatapartition
        with:
          id: rest.id
          addr: rest.addr
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: master-datapartitions-mcp
    port: 9090
    transport: http
    description: MCP adapter for CubeFS Master API — DataPartitions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cubefs-create-data-partition
      description: CubeFS Create a data partition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: master-datapartitions.createdatapartition
      with:
        count: tools.count
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: cubefs-decommission-data-partition
      description: CubeFS Decommission a data partition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: master-datapartitions.decommissiondatapartition
      with:
        id: tools.id
        addr: tools.addr
      outputParameters:
      - type: object
        mapping: $.
