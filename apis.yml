kind: opensource
name: CubeFS
description: >-
  CubeFS is a CNCF graduated cloud-native distributed file system supporting POSIX, HDFS, and S3-compatible object
  storage protocols. It provides multi-tenancy, multi-AZ deployment, cross-region replication, and erasure coding for
  both hot and cold data tiers, and is widely used to back cloud-native AI training, big-data analytics, and container
  storage workloads.
